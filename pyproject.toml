[project]
name = "idscanner"
version = "0.4.0"
description = "Scan both sides of an ID card onto one A4 PDF at its real size, in a small desktop app"
authors = [{ name = "anaisoob", email = "anaisoob@tutamail.com" }]
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.11"
keywords = ["scanner", "sane", "id card", "pdf", "photocopy", "gui"]
classifiers = [
    "Intended Audience :: End Users/Desktop",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Graphics :: Capture :: Scanners",
]
dependencies = ["customtkinter>=5.2", "id2pdf>=0.2.1"]

[project.urls]
Homepage = "https://github.com/anaisoob/idscanner"
Changelog = "https://github.com/anaisoob/idscanner/blob/main/CHANGELOG.md"
Issues = "https://github.com/anaisoob/idscanner/issues"

[project.scripts]
idscanner = "idscanner:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
# uv-managed Python builds Tk without Xft, which breaks CustomTkinter fonts and rounded corners on Linux
python-preference = "only-system"

[tool.uv.sources]
id2pdf = { path = "../id2pdf", editable = true }

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
